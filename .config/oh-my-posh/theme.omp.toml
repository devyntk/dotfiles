"$schema" = "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"
final_space = true
version = 4
streaming = 100

[palette]
true = "p:pine"
false = "p:love"
time = "p:muted"
os-fg = "p:base"
os-bg = "p:subtle"
root-fg = "p:base"
root-bg = "p:gold"
path = "p:gold"
git = "p:iris"
docker = "p:foam"
go = "p:rose"
haskell = "p:rose"
julia = "p:rose"
lua = "p:rose"
python = "p:rose"
rust = "p:rose"

[palettes]
template = "{{ if eq .OS \"macos\" }}standard{{ else }}dawn{{ end }}"

[palettes.list.standard]
base = "#191724"
surface = "#1f1d2e"
overlay = "#26233a"
muted = "#6e6a86"
subtle = "#908caa"
text = "#e0def4"
love = "#eb6f92"
gold = "#f6c177"
rose = "#ebbcba"
pine = "#31748f"
foam = "#9ccfd8"
iris = "#c4a7e7"
highlight-low = "#21202e"
highlight-med = "#403d52"
highlight-high = "#524f67"

[palettes.list.moon]
base = "#232136"
surface = "#2a273f"
overlay = "#393552"
muted = "#6e6a86"
subtle = "#908caa"
text = "#e0def4"
love = "#eb6f92"
gold = "#f6c177"
rose = "#ea9a97"
pine = "#3e8fb0"
foam = "#9ccfd8"
iris = "#c4a7e7"
highlight-low = "#2a283e"
highlight-med = "#44415a"
highlight-high = "#56526e"

[palettes.list.dawn]
base = "#faf4ed"
surface = "#fffaf3"
overlay = "#f2e9e1"
muted = "#9893a5"
subtle = "#797593"
text = "#464261"
love = "#b4637a"
gold = "#ea9d34"
rose = "#d7827e"
pine = "#286983"
foam = "#56949f"
iris = "#907aa9"
highlight-low = "#f4ede8"
highlight-med = "#dfdad9"
highlight-high = "#cecacd"

[transient_prompt]
foreground = "p:time"
template = "{{ now | date \"3:04 pm\" }} {{ if .Interrupted }}<red>^C </>{{ end }}{{ if gt .Code 0 }}<p:false>❯</>{{ else }}<p:true>❯</>{{ end }} "

[[blocks]]
type = "prompt"
alignment = "left"
newline = true

[[blocks.segments]]
type = "session"
style = "powerline"
trailing_diamond = ""
foreground = "p:os-fg"
background = "p:os-bg"
foreground_templates = [ "{{ if .Root }}p:root-fg{{ end }}" ]
background_templates = [ "{{ if .Root }}p:root-bg{{ end }}" ]
template = " {{ .UserName }} "

[[blocks.segments]]
type = "session"
style = "powerline"
powerline_symbol = ""
foreground = "p:os-fg"
background = "p:foam"
template = " {{ trimSuffix \".cnvr.net\" .HostName }} "

[[blocks.segments]]
type = "path"
style = "plain"
foreground = "p:path"
template = " {{ .Path }} "

[blocks.segments.properties]
home_icon = "~"
folder_icon = "..."
style = "agnoster_short"
max_depth = "4"
dir_length = "3"
full_length_dirs = "2"
display_root = true
mapped_locations_regex_expand = true

[blocks.segments.properties.mapped_locations]
"re:(.*/proj/(?P<repo>.*))" = " ${repo}"

[[blocks.segments]]
type = "git"
style = "plain"
foreground = "p:git"
template = "{{ .HEAD }} "

[blocks.segments.properties]
branch_icon = " "
cherry_pick_icon = " "
commit_icon = " "
fetch_status = false
fetch_stash_count = false
fetch_upstream_icon = false
merge_icon = " "
no_commits_icon = " "
rebase_icon = " "
revert_icon = " "
tag_icon = " "
disable_with_jj = true

[[blocks.segments]]
type = "jujutsu"
style = "plain"
foreground = "p:git"
template = "{{ .Working.String }}  {{.ClosestBookmarks}}  <b>{{.ChangeIDPrefix}}</b><p:muted>{{.ChangeIDRest}}</> "

[blocks.segments.properties]
fetch_status = true
change_id_min_len = 6

[[blocks.segments]]
type = "docker"
style = "plain"
foreground = "p:docker"
template = " {{ .Context }} "

[[blocks.segments]]
type = "go"
style = "plain"
foreground = "p:go"
template = " {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "

[[blocks.segments]]
type = "lua"
style = "plain"
foreground = "p:lua"
template = " {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "

[[blocks.segments]]
type = "python"
style = "plain"
foreground = "p:python"
template = " {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "

[blocks.segments.properties]
display_default = false
display_mode = "context"

[[blocks.segments]]
type = "rust"
style = "plain"
foreground = "p:rust"
template = " {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "

[[blocks]]
type = "prompt"
alignment = "right"

[[blocks.segments]]
type = "executiontime"
style = "plain"
foreground = "p:true"
foreground_templates = [ "{{ if .Code }}p:false{{ end }}" ]
template = "󰔟 {{ .FormattedMs }} "

[blocks.segments.properties]
threshold = 500
style = "austin"

[[blocks]]
type = "prompt"
alignment = "left"
newline = true

[[blocks.segments]]
type = "status"
style = "plain"
foreground = "p:true"
foreground_templates = [ "{{ if gt .Code 0 }}p:false{{ end }}" ]
template = "{{ if gt .Code 1 }}{{.Code}}{{ end }}❯ "

[blocks.segments.properties]
always_enabled = true

